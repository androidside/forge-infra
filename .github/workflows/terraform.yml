name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace to deploy'
        required: true
        type: choice
        options:
          - shared
          - services
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.0"
  TF_VAR_domain_name: "viralclips.ai"
  TF_VAR_rds_publicly_accessible: "true"
  TF_VAR_rds_allowed_cidr_blocks: '["89.39.212.206/32", "107.142.32.250/32"]'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # Detect which workspaces changed
  # --------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      services: ${{ steps.changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'modules/**'
              - 'environments/dev/shared/**'
            services:
              - 'modules/ecs-service/**'
              - 'environments/dev/services/**'

  # --------------------------------------------------------------------------
  # Plan / Apply for shared workspace
  # --------------------------------------------------------------------------
  shared:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.workspace == 'shared') ||
        (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.shared == 'true')
      )
    defaults:
      run:
        working-directory: environments/dev/shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Force Unlock & Retry Plan
        id: retry_plan
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Plan failed, checking for stale lock..."
          LOCK_ID=$(terraform plan -input=false -no-color 2>&1 | grep -oP 'ID:\s+\K[a-f0-9-]+' || true)
          if [ -n "$LOCK_ID" ]; then
            echo "Found stale lock $LOCK_ID, force-unlocking..."
            terraform force-unlock -force "$LOCK_ID"
            echo "Retrying plan..."
            terraform plan -input=false -no-color -out=tfplan
          else
            echo "No stale lock found, plan failed for another reason"
            exit 1
          fi

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan - Shared
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

      - name: Terraform Apply
        if: |
          (steps.plan.outcome == 'success' || steps.retry_plan.outcome == 'success') &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
          )
        run: terraform apply -auto-approve tfplan

  # --------------------------------------------------------------------------
  # Plan / Apply for services workspace
  # --------------------------------------------------------------------------
  services:
    runs-on: ubuntu-latest
    needs: [detect-changes, shared]
    if: |
      always() &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.workspace == 'services') ||
        (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.services == 'true')
      )
    defaults:
      run:
        working-directory: environments/dev/services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Force Unlock & Retry Plan
        id: retry_plan
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Plan failed, checking for stale lock..."
          LOCK_ID=$(terraform plan -input=false -no-color 2>&1 | grep -oP 'ID:\s+\K[a-f0-9-]+' || true)
          if [ -n "$LOCK_ID" ]; then
            echo "Found stale lock $LOCK_ID, force-unlocking..."
            terraform force-unlock -force "$LOCK_ID"
            echo "Retrying plan..."
            terraform plan -input=false -no-color -out=tfplan
          else
            echo "No stale lock found, plan failed for another reason"
            exit 1
          fi

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan - Services
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

      - name: Terraform Apply
        if: |
          (steps.plan.outcome == 'success' || steps.retry_plan.outcome == 'success') &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
          )
        run: terraform apply -auto-approve tfplan

  # --------------------------------------------------------------------------
  # Slack notification (skip on PR plan-only runs)
  # --------------------------------------------------------------------------
  notify:
    runs-on: ubuntu-latest
    needs: [detect-changes, shared, services]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Build commit list for Slack
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          BODY=$(jq -r --arg repo "${{ github.repository }}" '
            (.commits // [])[]
            | "• `<https://github.com/\($repo)/commit/\(.id)|\(.id[0:10])>` "
              + (.message | split("\n")[0])
              + " — _\(.author.name)_"
          ' <<<"$EVENT_JSON")
          if [ -z "$BODY" ]; then
            BODY="• Manual trigger by @${{ github.actor }} (no commits in event)"
          fi
          {
            echo 'COMMITS_BODY<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Slack - Terraform Success
        if: needs.shared.result != 'failure' && needs.services.result != 'failure' && needs.shared.result != 'cancelled' && needs.services.result != 'cancelled'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_FORGE_DEPLOYS_WEBHOOK_URL }}
          SLACK_COLOR: "#2eb886"
          SLACK_TEXT: |
            :white_check_mark: *Terraform Succeeded*

            *Commits:*
            ${{ env.COMMITS_BODY }}
            *Trigger:* ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Push' }}

            *Shared:* ${{ needs.shared.result == 'success' && ':white_check_mark: Applied' || ':white_circle: No changes' }}
            *Services:* ${{ needs.services.result == 'success' && ':white_check_mark: Applied' || ':white_circle: No changes' }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg text "${SLACK_TEXT:0:6000}" \
            --arg color "$SLACK_COLOR" \
            --arg ctx "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|${GITHUB_REPOSITORY}> • <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}>" \
            '{text: $text, attachments: [{color: $color, blocks: [{type: "context", elements: [{type: "mrkdwn", text: $ctx}]}]}]}')
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 --retry 2 --retry-all-errors \
            -H 'Content-type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Slack - Terraform Cancelled
        if: (needs.shared.result == 'cancelled' || needs.services.result == 'cancelled') && needs.shared.result != 'failure' && needs.services.result != 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_FORGE_DEPLOYS_WEBHOOK_URL }}
          SLACK_COLOR: "#daa038"
          SLACK_TEXT: |
            :warning: *Terraform Cancelled*

            Run was cancelled before completing.

            *Commits:*
            ${{ env.COMMITS_BODY }}
            *Trigger:* ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Push' }}

            *Shared:* ${{ needs.shared.result == 'success' && ':white_check_mark: Applied' || needs.shared.result == 'skipped' && ':white_circle: No changes' || needs.shared.result == 'cancelled' && ':warning: Cancelled' || ':x: Failed' }}
            *Services:* ${{ needs.services.result == 'success' && ':white_check_mark: Applied' || needs.services.result == 'skipped' && ':white_circle: No changes' || needs.services.result == 'cancelled' && ':warning: Cancelled' || ':x: Failed' }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg text "${SLACK_TEXT:0:6000}" \
            --arg color "$SLACK_COLOR" \
            --arg ctx "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|${GITHUB_REPOSITORY}> • <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}>" \
            '{text: $text, attachments: [{color: $color, blocks: [{type: "context", elements: [{type: "mrkdwn", text: $ctx}]}]}]}')
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 --retry 2 --retry-all-errors \
            -H 'Content-type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Slack - Terraform Failed
        if: needs.shared.result == 'failure' || needs.services.result == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_FORGE_DEPLOYS_WEBHOOK_URL }}
          SLACK_COLOR: "#a30200"
          SLACK_TEXT: |
            :rotating_light: *Terraform FAILED*

            *Commits:*
            ${{ env.COMMITS_BODY }}
            *Trigger:* ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Push' }}

            *Shared:* ${{ needs.shared.result == 'success' && ':white_check_mark: Applied' || needs.shared.result == 'skipped' && ':white_circle: No changes' || needs.shared.result == 'cancelled' && ':warning: Cancelled' || ':x: Failed' }}
            *Services:* ${{ needs.services.result == 'success' && ':white_check_mark: Applied' || needs.services.result == 'skipped' && ':white_circle: No changes' || needs.services.result == 'cancelled' && ':warning: Cancelled' || ':x: Failed' }}

            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg text "${SLACK_TEXT:0:6000}" \
            --arg color "$SLACK_COLOR" \
            --arg ctx "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|${GITHUB_REPOSITORY}> • <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}>" \
            '{text: $text, attachments: [{color: $color, blocks: [{type: "context", elements: [{type: "mrkdwn", text: $ctx}]}]}]}')
          curl --fail-with-body -sS --connect-timeout 5 --max-time 15 --retry 2 --retry-all-errors \
            -H 'Content-type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"
